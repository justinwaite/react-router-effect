name: Release

on:
  push:
    branches: [main]

# Don't cancel an in-flight publish; let releases finish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Default to no permissions; the job opts into exactly what it needs.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the version-bump commit and git tags
      pull-requests: write # open/update the "Version Packages" PR
      id-token: write # OIDC: token-free npm auth (Trusted Publishing) + provenance
    steps:
      # Mint a short-lived token for the release GitHub App. Using an App token
      # (instead of the default GITHUB_TOKEN) means the "Version Packages" PR and
      # its commits trigger CI, and — because the action pushes through the GitHub
      # API — the version commit is attributed to the App.
      - name: Generate release app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # changesets needs full history to build changelogs
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
          registry-url: https://registry.npmjs.org # registry config for publish (OIDC, no token)

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Create release PR or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        # v2 pushes the version commit and tags through the GitHub API by default,
        # so they're signed with GitHub's GPG key (verified). Required because the
        # repo's ruleset enforces signed commits. The action passes `github-token`
        # to both scripts as GITHUB_TOKEN (for @changesets/changelog-github) and
        # sets CHANGESETS_OUTPUT, which `vp run` forwards to `changeset publish`.
        #
        # No npm token: auth is via OIDC Trusted Publishing (configured on the
        # npm package settings for this repo + workflow). Provenance is
        # attached automatically under trusted publishing.
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          version-script: vp run changeset:version
          publish-script: vp run changeset:release
