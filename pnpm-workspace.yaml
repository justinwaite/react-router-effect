packages:
  - .
  - examples/*
allowBuilds:
  # workerd downloads the Workers runtime, which the Cloudflare example and test/workerd.test.ts run.
  esbuild: true
  msgpackr-extract: false
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: 5.0.5
  vite-plus: ^1.5.0
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
